name: Run Unit Local Test via Pytest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[full,dev]
      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check --output-format=github .
        continue-on-error: true
      - name: Get schema files from core
        run: |
          wget https://github.com/scc-digitalhub/digitalhub-core/archive/main.zip
          7z x main.zip
          rm main.zip
          mv digitalhub-core-main/schemas/specs test/instances/schemas
          rm -r digitalhub-core-main
      - name: Run unit tests
        run: |
          coverage erase
          coverage run --source=digitalhub -m pytest test/unittest -v
      - name: Run instance tests
        run: |
          coverage run --append --source=digitalhub -m pytest test/instances -v
      - name: Generate Coverage Report
        run: |
          coverage report -m
